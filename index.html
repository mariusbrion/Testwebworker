</head>
<body class="bg-slate-900 text-white overflow-hidden">

            </button>

    </main>

    <script>
        // --- LE MOTEUR WORKER TOTALEMENT REVU ---
        const workerBlob = new Blob([`
            let nodesLon = [];
            let nodesLat = [];
            let adj = []; 
            let totalNodes = 0;

            // Heap dynamique infinie : Ne crashera JAMAIS peu importe la densité du graphe
            class DynamicLazyHeap {
                constructor() {
                    this.data = []; // Utilisation d'un Array JS plat (très performant en V8)
                }
                push(id, dist) {
                    let i = this.data.length / 2;
                    this.data.push(id, dist);
                    while (i > 0) {
                        let p = (i - 1) >> 1;
                        if (this.data[p * 2 + 1] <= dist) break;
                        
                        this.data[i * 2] = this.data[p * 2];
                        this.data[i * 2 + 1] = this.data[p * 2 + 1];
                        i = p;
                    }
                    this.data[i * 2] = id;
                    this.data[i * 2 + 1] = dist;
                }
                pop() {
                    const len = this.data.length;
                    if (len === 0) return null;
                    
                    const topId = this.data[0];
                    const topDist = this.data[1];
                    
                    const botDist = this.data.pop();
                    const botId = this.data.pop();
                    
                    const size = this.data.length / 2;
                    if (size > 0) {
                        let i = 0;
                        while ((i * 2) + 1 < size) {
                            let left = (i * 2) + 1;
                            let right = left + 1;
                            let smallest = left;
                            
                            if (right < size && this.data[right * 2 + 1] < this.data[left * 2 + 1]) {
                                smallest = right;
                            }
                            if (this.data[smallest * 2 + 1] >= botDist) break;
                            
                            this.data[i * 2] = this.data[smallest * 2];
                            this.data[i * 2 + 1] = this.data[smallest * 2 + 1];
                            i = smallest;
                        }
                        this.data[i * 2] = botId;
                        this.data[i * 2 + 1] = botDist;
                    }
                    return { id: topId, dist: topDist };
                }
                get size() { return this.data.length / 2; }
            }

            self.onmessage = function(e) {
                const { type, data } = e.data;

                if (type === 'BUILD') {
                    // Force le nettoyage total de la RAM pour pouvoir enchainer les départements
                    nodesLon = []; nodesLat = []; adj = [];
                    let coordToId = new Map();
                    let idCounter = 0;

                    const elements = data.elements;
                    
                    function getId(lon, lat) {
                        const key = lon.toFixed(5) + ',' + lat.toFixed(5);
                        let id = coordToId.get(key);
                        if (id === undefined) {
                            id = idCounter++;
                            coordToId.set(key, id);
                            nodesLon.push(lon);
                            nodesLat.push(lat);
                            adj.push([]); 
                        }
                        return id;
                    }

                    elements.forEach(way => {
                        if (way.type === 'way') {
                            const hw = way.tags.highway;
                            let penalty = 1.0;
                            // Profil vélo
                            if (hw === 'primary' || hw === 'secondary') penalty = 3.0;
                            else if (hw === 'cycleway') penalty = 0.5;
                            else if (hw === 'motorway' || hw === 'trunk') return; // Exclu

                            const pts = way.geometry;
                            for (let i = 0; i < pts.length - 1; i++) {
                                const u = getId(pts[i].lon, pts[i].lat);
                                const v = getId(pts[i+1].lon, pts[i+1].lat);
                                const dist = getDist(pts[i].lat, pts[i].lon, pts[i+1].lat, pts[i+1].lon);
                                
                                const weight = dist * penalty;
                                
                                adj[u].push(v, weight, dist);
                                adj[v].push(u, weight, dist);
                            }
                        }
                    });

                    totalNodes = idCounter;
                    coordToId.clear(); // IMPORTANT: détruit la Map pour libérer la RAM
                    coordToId = null; 

                    self.postMessage({ type: 'READY', nodes: totalNodes });
                }

                if (type === 'ROUTE') {
                    const startT = Date.now();
                    const path = runDijkstra(data.start, data.end);
                    self.postMessage({ type: 'RESULT', path, time: Date.now() - startT });
                }
            };

            function getDist(la1, lo1, la2, lo2) {
                const dLat = (la2 - la1) * Math.PI / 180;
                const dLon = (lo2 - lo1) * Math.PI / 180;
                const a = Math.sin(dLat/2)**2 + Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLon/2)**2;
                return 12742 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); // 12742 = 2 * 6371 (Rayon terre)
            }

            function findNearestId(lon, lat) {
                let min = Infinity, bestId = -1;
                for (let i = 0; i < totalNodes; i++) {
                    const d = (nodesLon[i] - lon)**2 + (nodesLat[i] - lat)**2;
                    if (d < min) { min = d; bestId = i; }
                }
                return bestId;
            }

            function runDijkstra(sObj, eObj) {
                const startId = findNearestId(sObj.lng, sObj.lat);
                const endId = findNearestId(eObj.lng, eObj.lat);
                
                const dists = new Float64Array(totalNodes);
                dists.fill(Infinity);
                const prevNode = new Int32Array(totalNodes);
                prevNode.fill(-1);
                const prevDist = new Float32Array(totalNodes);

                const pq = new DynamicLazyHeap(); 

                dists[startId] = 0;
                pq.push(startId, 0);

                while (pq.size > 0) {
                    const top = pq.pop();
                    const curr = top.id;
                    const d = top.dist;

                    if (curr === endId) break;
                    if (d > dists[curr]) continue;

                    const neighbors = adj[curr];
                    for (let i = 0; i < neighbors.length; i += 3) {
                        const target = neighbors[i];
                        const weight = neighbors[i+1];
                        const realDist = neighbors[i+2];
                        const newD = d + weight;

                        if (newD < dists[target]) {
                            dists[target] = newD;
                            prevNode[target] = curr;
                            prevDist[target] = realDist;
                            pq.push(target, newD);
                        }
                    }
                }

                if (prevNode[endId] === -1 && startId !== endId) {
                    return { coords: [], totalDist: 0 }; // Graphe déconnecté
                }

                const coords = [];
                let curr = endId;
                let totalDist = 0;

                while (curr !== -1) {
                    coords.push([nodesLat[curr], nodesLon[curr]]);
                    totalDist += prevDist[curr] || 0;
                    curr = prevNode[curr];
                }
                return { coords, totalDist };
            }
        `], { type: 'application/javascript' });

        const worker = new Worker(URL.createObjectURL(workerBlob));
        let map, routeLayer, startMarker, endMarker;
        let points = { start: null, end: null };
        let isReady = false;

        window.onload = () => {
            map = L.map('map', { zoomControl: false }).setView([46.5, 2.5], 6);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            document.getElementById('loadBtn').onclick = loadData;
            map.on('click', handleMapClick);

            worker.onmessage = (e) => {
                const { type, nodes, path, time } = e.data;
                if (type === 'READY') {
                    isReady = true;
                    updateStatus('Moteur opérationnel', false, 100);
                    document.getElementById('statsDetail').innerHTML = `Graphe compilé : <span class="text-emerald-400 font-bold">${nodes.toLocaleString()}</span> carrefours prêts pour le routage.`;
                    setTimeout(() => { if(isReady) document.getElementById('statusBox').classList.add('hidden'); }, 3000);
                } else if (type === 'RESULT') {
                    showRoute(path, time);
                }
            };
        };

        async function loadData() {
            resetFull(); // Nettoie totalement la carte avant de changer de région
            
            const boundsMap = {
                "large": [44.7, -0.8, 45.3, 0.2],
                "paris": [48.75, 2.15, 48.95, 2.45],
                "lyon": [45.65, 4.70, 45.85, 4.95]
            };
            const code = document.getElementById('deptSelect').value;
            const b = boundsMap[code];

            updateStatus('Acquisition des données...', true, 20);
            document.getElementById('statsDetail').innerText = "Téléchargement d'OpenStreetMap (peut prendre 10 à 30 secondes...)";
            map.fitBounds([[b[0], b[1]], [b[2], b[3]]]);
            isReady = false;

            // Filtre élargi pour inclure les zones piétonnes, chemins de terre et liaisons secondaires pour éviter les "trous"
            const query = `[out:json][timeout:90];
                way["highway"~"primary|secondary|tertiary|unclassified|residential|living_street|cycleway|path|pedestrian|track"](${b[0]},${b[1]},${b[2]},${b[3]});
                out geom;`;
            
            try {
                const res = await fetch('https://overpass-api.de/api/interpreter', {
                    method: 'POST',
                    body: `data=${encodeURIComponent(query)}`
                });
                if(!res.ok) throw new Error("Overpass API Surchargée");
                const data = await res.json();
                
                updateStatus('Construction du graphe...', true, 70);
                document.getElementById('statsDetail').innerText = "Analyse des connexions et indexation en mémoire RAM...";
                worker.postMessage({ type: 'BUILD', data });
            } catch (err) {
                updateStatus('Erreur Réseau', false, 0);
                document.getElementById('statsDetail').innerHTML = "<span class='text-red-400'>La zone est trop grande ou le serveur d'API est saturé. Réessayez.</span>";
            }
        }

        function handleMapClick(e) {
            if (!isReady) return;

            if (!points.start) {
                points.start = e.latlng;
                startMarker = L.circleMarker(e.latlng, { color: '#10b981', radius: 8, fillOpacity: 1, weight: 2, color: '#fff' }).addTo(map);
            } else if (!points.end) {
                points.end = e.latlng;
                endMarker = L.circleMarker(e.latlng, { color: '#ef4444', radius: 8, fillOpacity: 1, weight: 2, color: '#fff' }).addTo(map);
                
                updateStatus('Calcul Dijkstra en cours...', true, 80);
                document.getElementById('statsDetail').innerText = "Recherche du meilleur itinéraire...";
                worker.postMessage({ type: 'ROUTE', data: { start: points.start, end: points.end } });
            } else {
                resetPoints();
                handleMapClick(e);
            }
        }

        function showRoute(path, time) {
            if (routeLayer) map.removeLayer(routeLayer);
            
            // Gestion propre des erreurs de graphe déconnecté (plus d'alerte bloquante !)
            if (!path || path.coords.length === 0) {
                resetPoints();
                updateStatus('Calcul Échoué', false, 0);
                document.getElementById('statsDetail').innerHTML = '<span class="text-red-400 font-bold">Chemin impossible.</span> Ces deux points ne sont pas reliés par des routes carrossables/cyclables dans les données chargées.';
                setTimeout(() => document.getElementById('statusBox').classList.add('hidden'), 5000);
                return;
            }

            // Gestion du succès cohérente
            updateStatus('Itinéraire trouvé !', false, 100);
            document.getElementById('statsDetail').innerText = `Calcul effectué avec succès.`;
            setTimeout(() => document.getElementById('statusBox').classList.add('hidden'), 2000);

            routeLayer = L.polyline(path.coords, { color: '#10b981', weight: 5, opacity: 1, lineJoin: 'round' }).addTo(map);
            document.getElementById('routeInfo').classList.remove('hidden');
            document.getElementById('txtDist').innerText = path.totalDist.toFixed(1);
            document.getElementById('txtTime').innerText = time;
        }

        function resetPoints() {
            points = { start: null, end: null };
            if (startMarker) map.removeLayer(startMarker);
            if (endMarker) map.removeLayer(endMarker);
            if (routeLayer) map.removeLayer(routeLayer);
            document.getElementById('routeInfo').classList.add('hidden');
        }

        function resetFull() {
            resetPoints();
            document.getElementById('statusBox').classList.add('hidden');
        }

        function updateStatus(label, loading, progress = 0) {
            document.getElementById('statusBox').classList.remove('hidden');
            document.getElementById('statusLabel').innerText = label;
            document.getElementById('loader').style.display = loading ? 'block' : 'none';
            document.getElementById('progressBar').style.width = progress + '%';
        }
    </script>
</body>
</html>
