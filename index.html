    <script>
        // --- WORKER BINAIRE IDENTIQUE ---
        const workerBlob = new Blob([`
            const MAX_NODES = 4000000;
            const MAX_EDGES = 12000000;
            let nodesLon, nodesLat, head, nodeCount = 0;
            let edgeTo, edgeWeight, edgeDist, edgeNext, edgeCount = 0;
            let coordToId, processedWays;

            class DynamicLazyHeap {
                constructor() { this.data = []; }
                push(id, dist) {
                    let i = this.data.length / 2;
                    this.data.push(id, dist);
                    while (i > 0) {
                        let p = (i - 1) >> 1;
                        if (this.data[p * 2 + 1] <= dist) break;
                        this.data[i * 2] = this.data[p * 2];
                        this.data[i * 2 + 1] = this.data[p * 2 + 1];
                        i = p;
                    }
                    this.data[i * 2] = id;
                    this.data[i * 2 + 1] = dist;
                }
                pop() {
                    if (this.data.length === 0) return null;
                    const topId = this.data[0], topDist = this.data[1];
                    const botDist = this.data.pop(), botId = this.data.pop();
                    const size = this.data.length / 2;
                    if (size > 0) {
                        let i = 0;
                        while ((i * 2) + 1 < size) {
                            let left = (i * 2) + 1, right = left + 1, smallest = left;
                            if (right < size && this.data[right * 2 + 1] < this.data[left * 2 + 1]) smallest = right;
                            if (this.data[smallest * 2 + 1] >= botDist) break;
                            this.data[i * 2] = this.data[smallest * 2];
                            this.data[i * 2 + 1] = this.data[smallest * 2 + 1];
                            i = smallest;
                        }
                        this.data[i * 2] = botId;
                        this.data[i * 2 + 1] = botDist;
                    }
                    return { id: topId, dist: topDist };
                }
                get size() { return this.data.length / 2; }
            }

            self.onmessage = function(e) {
                const { type, data } = e.data;
                if (type === 'BUILD_START') {
                    nodesLon = new Float32Array(MAX_NODES);
                    nodesLat = new Float32Array(MAX_NODES);
                    head = new Int32Array(MAX_NODES).fill(-1);
                    edgeTo = new Int32Array(MAX_EDGES);
                    edgeWeight = new Float32Array(MAX_EDGES);
                    edgeDist = new Float32Array(MAX_EDGES);
                    edgeNext = new Int32Array(MAX_EDGES);
                    nodeCount = 0; edgeCount = 0;
                    coordToId = new Map(); processedWays = new Set();
                }
                if (type === 'BUILD_CHUNK') {
                    const getHash = (lon, lat) => (Math.round((lon + 180) * 100000) | 0) * 100000000 + (Math.round((lat + 90) * 100000) | 0);
                    const getId = (lon, lat) => {
                        const key = getHash(lon, lat);
                        let id = coordToId.get(key);
                        if (id === undefined && nodeCount < MAX_NODES) {
                            id = nodeCount++; coordToId.set(key, id);
                            nodesLon[id] = lon; nodesLat[id] = lat;
                        }
                        return id;
                    };
                    const addEdge = (u, v, w, d) => {
                        if (edgeCount < MAX_EDGES && u !== -1 && v !== -1) {
                            edgeTo[edgeCount] = v; edgeWeight[edgeCount] = w; edgeDist[edgeCount] = d;
                            edgeNext[edgeCount] = head[u]; head[u] = edgeCount++;
                        }
                    };
                    data.forEach(way => {
                        if (way.type === 'way' && !processedWays.has(way.id)) {
                            processedWays.add(way.id);
                            const hw = way.tags?.highway;
                            let p = 1.0;
                            if (hw === 'primary' || hw === 'secondary') p = 3.0;
                            else if (hw === 'cycleway') p = 0.5;
                            else if (hw === 'motorway' || hw === 'trunk') return;
                            const pts = way.geometry;
                            if (!pts) return;
                            for (let i = 0; i < pts.length - 1; i++) {
                                const u = getId(pts[i].lon, pts[i].lat), v = getId(pts[i+1].lon, pts[i+1].lat);
                                const d = getDist(pts[i].lat, pts[i].lon, pts[i+1].lat, pts[i+1].lon);
                                addEdge(u, v, d * p, d); addEdge(v, u, d * p, d);
                            }
                        }
                    });
                }
                if (type === 'BUILD_FINISH') {
                    coordToId.clear(); coordToId = null; processedWays.clear(); processedWays = null;
                    self.postMessage({ type: 'READY', nodes: nodeCount, edges: edgeCount });
                }
                if (type === 'ROUTE') {
                    const startT = Date.now();
                    const path = runDijkstra(data.start, data.end);
                    self.postMessage({ type: 'RESULT', path, time: Date.now() - startT });
                }
            };

            function getDist(la1, lo1, la2, lo2) {
                const dLat = (la2 - la1) * Math.PI / 180, dLon = (lo2 - lo1) * Math.PI / 180;
                const a = Math.sin(dLat/2)**2 + Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLon/2)**2;
                return 12742 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
            }

            function runDijkstra(s, e) {
                let minStart = Infinity, startId = -1, minEnd = Infinity, endId = -1;
                for (let i = 0; i < nodeCount; i++) {
                    const ds = (nodesLon[i] - s.lng)**2 + (nodesLat[i] - s.lat)**2;
                    if (ds < minStart) { minStart = ds; startId = i; }
                    const de = (nodesLon[i] - e.lng)**2 + (nodesLat[i] - e.lat)**2;
                    if (de < minEnd) { minEnd = de; endId = i; }
                }
                const dists = new Float64Array(nodeCount).fill(Infinity);
                const prev = new Int32Array(nodeCount).fill(-1), pDist = new Float32Array(nodeCount);
                const pq = new DynamicLazyHeap();
                dists[startId] = 0; pq.push(startId, 0);
                while (pq.size > 0) {
                    const { id: curr, dist: d } = pq.pop();
                    if (curr === endId) break;
                    if (d > dists[curr]) continue;
                    for (let e = head[curr]; e !== -1; e = edgeNext[e]) {
                        const target = edgeTo[e], newD = d + edgeWeight[e];
                        if (newD < dists[target]) {
                            dists[target] = newD; prev[target] = curr; pDist[target] = edgeDist[e]; pq.push(target, newD);
                        }
                    }
                }
                const coords = []; let curr = endId, totalDist = 0;
                if (prev[endId] === -1 && startId !== endId) return { coords: [], totalDist: 0 };
                while (curr !== -1) {
                    coords.push([nodesLat[curr], nodesLon[curr]]);
                    totalDist += pDist[curr]; curr = prev[curr];
                }
                return { coords, totalDist };
            }
        `], { type: 'application/javascript' });

        const worker = new Worker(URL.createObjectURL(workerBlob));
        let map, routeLayer, startMarker, endMarker, deptLayer;
        let points = { start: null, end: null }, selectedDepts = new Set(), currentMode = 'SELECT';

        window.onload = () => {
            map = L.map('map', { zoomControl: false }).setView([46.5, 2.5], 6);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { attribution: '© OSM | © CartoDB', maxZoom: 19 }).addTo(map);
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            document.getElementById('loadBtn').onclick = loadData;
            document.getElementById('resetZoneBtn').onclick = resetFullZone;
            map.on('click', handleMapClick);

            worker.onmessage = (e) => {
                const { type, nodes, edges, path, time } = e.data;
                if (type === 'READY') {
                    currentMode = 'ROUTE';
                    document.getElementById('pingSelect').classList.add('hidden');
                    document.getElementById('instructionText').innerText = "Placer départ/arrivée";
                    updateStatus('Prêt', false, 100);
                    document.getElementById('statsDetail').innerHTML = `Graphe compilé : <b>${nodes.toLocaleString()}</b> nœuds et <b>${edges.toLocaleString()}</b> routes.`;
                } else if (type === 'RESULT') showRoute(path, time);
            };
            loadDepts();
        };

        async function loadDepts() {
            const res = await fetch('https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/departements-version-simplifiee.geojson');
            const data = await res.json();
            deptLayer = L.geoJSON(data, {
                style: { color: '#475569', weight: 1, fillOpacity: 0.1, fillColor: '#64748b' },
                onEachFeature: (f, l) => {
                    l.on('click', () => {
                        if (currentMode !== 'SELECT') return;
                        const c = f.properties.code;
                        if (selectedDepts.has(c)) { selectedDepts.delete(c); l.setStyle({ fillOpacity: 0.1, weight: 1 }); }
                        else { selectedDepts.add(c); l.setStyle({ fillOpacity: 0.5, fillColor: '#10b981', weight: 2 }); }
                        document.getElementById('selCount').innerText = selectedDepts.size;
                    });
                }
            }).addTo(map);
        }

        async function loadData() {
            if (selectedDepts.size === 0) return;
            currentMode = 'LOADING';
            document.getElementById('loadBtn').classList.add('hidden');
            document.getElementById('resetZoneBtn').classList.remove('hidden');
            worker.postMessage({ type: 'BUILD_START' });

            const layers = deptLayer.getLayers().filter(l => selectedDepts.has(l.feature.properties.code));
            map.fitBounds(new L.featureGroup(layers).getBounds(), { padding: [20, 20] });
            deptLayer.setStyle({ opacity: 0, fillOpacity: 0 });

            // On génère la liste des "Tuiles" (subdivision de chaque département en 4)
            let tiles = [];
            layers.forEach(l => {
                const b = l.getBounds();
                const midLat = (b.getSouth() + b.getNorth()) / 2;
                const midLon = (b.getWest() + b.getEast()) / 2;
                const name = l.feature.properties.nom;
                tiles.push(
                    { name: name + " (SO)", bbox: `${b.getSouth()},${b.getWest()},${midLat},${midLon}` },
                    { name: name + " (SE)", bbox: `${b.getSouth()},${midLon},${midLat},${b.getEast()}` },
                    { name: name + " (NO)", bbox: `${midLat},${b.getWest()},${b.getNorth()},${midLon}` },
                    { name: name + " (NE)", bbox: `${midLat},${midLon},${b.getNorth()},${b.getEast()}` }
                );
            });

            for (let i = 0; i < tiles.length; i++) {
                const t = tiles[i];
                const progress = (i / tiles.length) * 100;
                updateStatus(`Chargement ${i+1}/${tiles.length}`, true, progress);
                document.getElementById('statsDetail').innerText = `Tuile : ${t.name}...`;

                let success = false;
                let retries = 0;

                while (!success && retries < 3) {
                    try {
                        const res = await fetch('https://overpass-api.de/api/interpreter', {
                            method: 'POST',
                            body: `data=${encodeURIComponent(`[out:json][timeout:90][maxsize:536870912];way["highway"~"primary|secondary|tertiary|unclassified|residential|living_street|cycleway|path|track"](${t.bbox});out geom;`)}`
                        });
                        if (!res.ok) throw new Error();
                        const data = await res.json();
                        worker.postMessage({ type: 'BUILD_CHUNK', data: data.elements });
                        success = true;
                    } catch (e) {
                        retries++;
                        document.getElementById('statsDetail').innerText = `Échec tuile ${t.name}. Nouvelle tentative (${retries}/3)...`;
                        await new Promise(r => setTimeout(r, 3000));
                    }
                }
                // Pause de sécurité entre les tuiles
                await new Promise(r => setTimeout(r, 1500));
            }

            updateStatus('Finalisation', true, 98);
            worker.postMessage({ type: 'BUILD_FINISH' });
        }

        function handleMapClick(e) {
            if (currentMode !== 'ROUTE') return;
            if (!points.start) {
                points.start = e.latlng;
                startMarker = L.circleMarker(e.latlng, { color: '#fff', fillColor: '#10b981', radius: 8, fillOpacity: 1, weight: 2 }).addTo(map);
            } else if (!points.end) {
                points.end = e.latlng;
                endMarker = L.circleMarker(e.latlng, { color: '#fff', fillColor: '#ef4444', radius: 8, fillOpacity: 1, weight: 2 }).addTo(map);
                updateStatus('Calcul...', true, 50);
                worker.postMessage({ type: 'ROUTE', data: { start: points.start, end: points.end } });
            } else { resetPoints(); handleMapClick(e); }
        }

        function showRoute(path, time) {
            if (routeLayer) map.removeLayer(routeLayer);
            if (!path || path.coords.length === 0) {
                updateStatus('Échec', false, 0);
                document.getElementById('statsDetail').innerText = "Aucun chemin trouvé entre ces deux points.";
                resetPoints();
                return;
            }
            document.getElementById('statusBox').classList.add('hidden');
            routeLayer = L.polyline(path.coords, { color: '#10b981', weight: 6, opacity: 0.9 }).addTo(map);
            map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });
            document.getElementById('routeInfo').classList.remove('hidden');
            document.getElementById('txtDist').innerText = path.totalDist.toFixed(1);
            document.getElementById('txtTime').innerText = time;
        }

        function resetPoints() {
            points = { start: null, end: null };
            if (startMarker) map.removeLayer(startMarker); if (endMarker) map.removeLayer(endMarker); if (routeLayer) map.removeLayer(routeLayer);
            document.getElementById('routeInfo').classList.add('hidden');
        }

        function resetFullZone() {
            resetPoints(); selectedDepts.clear();
            document.getElementById('selCount').innerText = "0";
            document.getElementById('statusBox').classList.add('hidden');
            document.getElementById('resetZoneBtn').classList.add('hidden');
            document.getElementById('loadBtn').classList.remove('hidden');
            document.getElementById('instructionText').innerText = "Sélectionnez vos zones";
            document.getElementById('pingSelect').classList.remove('hidden');
            deptLayer.setStyle({ opacity: 1, fillOpacity: 0.1, fillColor: '#64748b' });
            currentMode = 'SELECT';
        }

        function updateStatus(l, loading, p = 0) {
            document.getElementById('statusBox').classList.remove('hidden');
            document.getElementById('statusLabel').innerText = l;
            document.getElementById('loader').style.display = loading ? 'block' : 'none';
            document.getElementById('progressBar').style.width = p + '%';
        }
    </script>
</body>
</html>
