<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VéloRoute Pro - Moteur Départemental</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>

</head>
<body class="bg-slate-50 overflow-hidden">

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-none">VéloRoute <span class="text-emerald-400">Pro</span></h1>
                <p class="text-[10px] text-slate-400 uppercase tracking-widest mt-1">Full-Front Routing Engine</p>

        <div class="flex items-center gap-3">

        <div id="resultPanel" class="absolute bottom-8 left-1/2 -translate-x-1/2 z-[1000] bg-slate-900 text-white px-8 py-4 rounded-2xl shadow-2xl flex items-center gap-8 border border-slate-700 hidden">
            <div>
                <p class="text-[10px] text-slate-400 uppercase font-bold">Distance</p>
                <p class="text-xl font-black text-emerald-400"><span id="distVal">0</span> <span class="text-sm font-normal">km</span></p>
            </div>

            <div>
                <p class="text-[10px] text-slate-400 uppercase font-bold">Temps estimé</p>
                <p class="text-xl font-black"><span id="timeVal">0</span> <span class="text-sm font-normal">min</span></p>
            </div>
            <button onclick="resetPoints()" class="ml-4 p-2 hover:bg-slate-800 rounded-full transition-colors text-slate-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd" />
                </svg>
            </button>
        </div>
    </main>

    <script>
        // Configuration des zones (approx pour la démo)
        const REGIONS = {
            "75": [48.81, 2.22, 48.90, 2.47],
            "92": [48.75, 2.15, 48.95, 2.35],
            "69": [45.7, 4.75, 45.85, 4.95],
            "33": [44.8, -0.65, 44.95, -0.45],
            "13": [43.2, 5.3, 43.4, 5.5]
        };

        let map, startMarker, endMarker, routeLayer;
        let points = { start: null, end: null };
        let isGraphReady = false;

        // --- SOURCE DU WEB WORKER AVEC MIN-HEAP ---
        const workerCode = `
            // Implémentation d'une Min-Heap pour Dijkstra ultra-rapide
            class MinHeap {
                constructor() { this.heap = []; this.pos = new Map(); }
                push(node, priority) {
                    const item = { node, priority };
                    this.pos.set(node, this.heap.length);
                    this.heap.push(item);
                    this.bubbleUp(this.heap.length - 1);
                }
                pop() {
                    if (this.isEmpty()) return null;
                    const min = this.heap[0];
                    const last = this.heap.pop();
                    this.pos.delete(min.node);
                    if (!this.isEmpty()) {
                        this.heap[0] = last;
                        this.pos.set(last.node, 0);
                        this.bubbleDown(0);
                    }
                    return min;
                }
                bubbleUp(index) {
                    while (index > 0) {
                        let parent = (index - 1) >> 1;
                        if (this.heap[index].priority < this.heap[parent].priority) {
                            this.swap(index, parent);
                            index = parent;
                        } else break;
                    }
                }
                bubbleDown(index) {
                    while (true) {
                        let left = (index << 1) + 1, right = (index << 1) + 2, smallest = index;
                        if (left < this.heap.length && this.heap[left].priority < this.heap[smallest].priority) smallest = left;
                        if (right < this.heap.length && this.heap[right].priority < this.heap[smallest].priority) smallest = right;
                        if (smallest !== index) { this.swap(index, smallest); index = smallest; } else break;
                    }
                }
                swap(i, j) {
                    [this.heap[i], this.heap[j]] = [this.heap[j], this.heap[i]];
                    this.pos.set(this.heap[i].node, i);
                    this.pos.set(this.heap[j].node, j);
                }
                isEmpty() { return this.heap.length === 0; }
                decreaseKey(node, priority) {
                    const index = this.pos.get(node);
                    if (index !== undefined) {
                        this.heap[index].priority = priority;
                        this.bubbleUp(index);
                    }
                }
            }

            let graph = new Map();

            self.onmessage = async function(e) {
                const { type, data } = e.data;

                if (type === 'BUILD_GRAPH') {
                    graph = new Map();
                    const elements = data.elements;
                    let edgeCount = 0;

                    elements.forEach(way => {
                        if (way.type === 'way') {
                            const highway = way.tags.highway;
                            // Profil vélo : on pénalise les grosses routes
                            let penalty = 1.0;
                            if (highway === 'primary') penalty = 5.0;
                            else if (highway === 'secondary') penalty = 2.0;
                            else if (highway === 'cycleway' || highway === 'path') penalty = 0.8;
                            else if (highway === 'motorway' || highway === 'trunk') return; // Interdit

                            const coords = way.geometry;
                            for (let i = 0; i < coords.length - 1; i++) {
                                const u = \`\${coords[i].lon},\${coords[i].lat}\`;
                                const v = \`\${coords[i+1].lon},\${coords[i+1].lat}\`;
                                const d = getDistance(coords[i].lat, coords[i].lon, coords[i+1].lat, coords[i+1].lon) * penalty;

                                if (!graph.has(u)) graph.set(u, []);
                                if (!graph.has(v)) graph.set(v, []);
                                graph.get(u).push({ to: v, dist: d, realDist: d/penalty });
                                graph.get(v).push({ to: u, dist: d, realDist: d/penalty });
                                edgeCount++;
                            }
                        }
                    });
                    self.postMessage({ type: 'READY', nodeCount: graph.size, edgeCount });
                }

                if (type === 'ROUTE') {
                    const result = runDijkstra(data.start, data.end);
                    self.postMessage({ type: 'RESULT', result });
                }
            };

            function getDistance(lat1, lon1, lat2, lon2) {
                const R = 6371;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
                return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            }

            function findNearest(coord) {
                let min = Infinity, nearest = null;
                const [targetLon, targetLat] = coord.split(',').map(Number);
                for (let node of graph.keys()) {
                    const [lon, lat] = node.split(',').map(Number);
                    const d = (targetLat-lat)**2 + (targetLon-lon)**2;
                    if (d < min) { min = d; nearest = node; }
                }
                return nearest;
            }

            function runDijkstra(s, e) {
                const start = findNearest(s);
                const end = findNearest(e);
                const dists = new Map();
                const prev = new Map();
                const pq = new MinHeap();

                dists.set(start, 0);
                pq.push(start, 0);

                while (!pq.isEmpty()) {
                    const { node: curr, priority: d } = pq.pop();
                    if (curr === end) break;
                    if (d > (dists.get(curr) || Infinity)) continue;

                    for (let edge of (graph.get(curr) || [])) {
                        const newDist = d + edge.dist;
                        if (newDist < (dists.get(edge.to) || Infinity)) {
                            dists.set(edge.to, newDist);
                            prev.set(edge.to, curr);
                            pq.push(edge.to, newDist);
                        }
                    }
                }

                const path = [];
                let curr = end;
                let totalKm = 0;
                while (curr) {
                    path.push(curr.split(',').map(Number));
                    const p = prev.get(curr);
                    if (p) {
                        const edge = graph.get(p).find(e => e.to === curr);
                        totalKm += edge.realDist;
                    }
                    curr = p;
                }
                return { coords: path.reverse(), distance: totalKm };
            }
        `;

        // --- LOGIQUE MAIN UI ---
        const workerBlob = new Blob([workerCode], { type: 'application/javascript' });
        const worker = new Worker(URL.createObjectURL(workerBlob));

        window.onload = () => {
            map = L.map('map', { zoomControl: false }).setView([48.8566, 2.3522], 12);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '© OpenStreetMap | VéloRoute'
            }).addTo(map);
            L.control.zoom({ position: 'topright' }).addTo(map);

            worker.onmessage = handleWorkerMessage;
            document.getElementById('loadBtn').onclick = fetchNetwork;
            map.on('click', handleMapClick);
        };

        async function fetchNetwork() {
            const dept = document.getElementById('deptSelect').value;
            const b = REGIONS[dept];
            
            showStatus("Téléchargement du réseau complet...", 20);
            
            // Requête complète : toutes les routes circulables sauf autoroutes
            const query = `[out:json][timeout:60];
                way["highway"](${b[0]},${b[1]},${b[2]},${b[3]})["highway"!~"motorway|trunk"];
                out geom;`;

            try {
                const res = await fetch('https://overpass-api.de/api/interpreter', {
                    method: 'POST',
                    body: `data=${encodeURIComponent(query)}`
                });
                const data = await res.json();
                
                showStatus("Optimisation du graphe binaire...", 70);
                worker.postMessage({ type: 'BUILD_GRAPH', data });
                map.fitBounds([[b[0], b[1]], [b[2], b[3]]]);
            } catch (e) {
                alert("Erreur Overpass. Essayez une zone plus petite ou réessayez.");
                hideStatus();
            }
        }

        function handleWorkerMessage(e) {
            const { type, nodeCount, edgeCount, result } = e.data;
            if (type === 'READY') {
                isGraphReady = true;
                showStatus("Prêt !", 100);
                document.getElementById('statsDetail').innerText = `${nodeCount.toLocaleString()} nœuds | ${edgeCount.toLocaleString()} segments`;
                document.getElementById('statusIcon').classList.replace('loader-spin', 'text-emerald-500');
                document.getElementById('statusIcon').innerHTML = '✓';
                setTimeout(hideStatus, 2000);
            } else if (type === 'RESULT') {
                hideStatus();
                drawRoute(result);
            }
        }

        function handleMapClick(e) {
            if (!isGraphReady) return;

            if (!points.start) {
                points.start = e.latlng;
                if (startMarker) map.removeLayer(startMarker);
                startMarker = L.circleMarker(e.latlng, { radius: 8, color: '#10b981', fillOpacity: 1 }).addTo(map);
            } else if (!points.end) {
                points.end = e.latlng;
                endMarker = L.circleMarker(e.latlng, { radius: 8, color: '#ef4444', fillOpacity: 1 }).addTo(map);
                
                showStatus("Calcul de l'itinéraire vélo...", 50);
                worker.postMessage({ 
                    type: 'ROUTE', 
                    data: { 
                        start: `${points.start.lng},${points.start.lat}`, 
                        end: `${points.end.lng},${points.end.lat}` 
                    } 
                });
            } else {
                resetPoints();
                handleMapClick(e);
            }
        }

        function drawRoute(res) {
            if (routeLayer) map.removeLayer(routeLayer);
            if (res.coords.length < 2) return alert("Aucun chemin trouvé.");

            routeLayer = L.polyline(res.coords.map(c => [c[1], c[0]]), {
                color: '#10b981', weight: 6, opacity: 0.9, lineJoin: 'round'
            }).addTo(map);

            document.getElementById('resultPanel').classList.remove('hidden');
            document.getElementById('distVal').innerText = res.distance.toFixed(1);
            document.getElementById('timeVal').innerText = Math.round(res.distance * 4); // ~15km/h
        }

        function resetPoints() {
            points = { start: null, end: null };
            if (startMarker) map.removeLayer(startMarker);
            if (endMarker) map.removeLayer(endMarker);
            if (routeLayer) map.removeLayer(routeLayer);
            document.getElementById('resultPanel').classList.add('hidden');
        }

        function showStatus(txt, prg) {
            document.getElementById('statusPanel').classList.remove('hidden');
            document.getElementById('statusLabel').innerText = txt;
            document.getElementById('progressBar').style.width = prg + '%';
        }

        function hideStatus() {
            document.getElementById('statusPanel').classList.add('hidden');
        }
    </script>
</body>
</html>
