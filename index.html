    <script>
        // --- WEB WORKER ENGINE (Optimisé Mémoire) ---
        const workerBlob = new Blob([`
            let adj = []; // Utilisation de tableaux typés pour la performance si possible
            let nodes = [];
            let graph = new Map();

            // MinHeap pour Dijkstra
            class FastHeap {
                constructor() { this.h = []; }
                push(n, p) { 
                    this.h.push({n, p}); this.bubbleUp(this.h.length-1); 
                }
                pop() {
                    if(this.h.length === 0) return null;
                    const top = this.h[0];
                    const last = this.h.pop();
                    if(this.h.length > 0) { this.h[0] = last; this.bubbleDown(0); }
                    return top;
                }
                bubbleUp(i) {
                    while(i > 0) {
                        let p = (i-1) >> 1;
                        if(this.h[i].p < this.h[p].p) { [this.h[i], this.h[p]] = [this.h[p], this.h[i]]; i = p; }
                        else break;
                    }
                }
                bubbleDown(i) {
                    while(true) {
                        let l = (i<<1)+1, r = (i<<1)+2, s = i;
                        if(l < this.h.length && this.h[l].p < this.h[s].p) s = l;
                        if(r < this.h.length && this.h[r].p < this.h[s].p) s = r;
                        if(s !== i) { [this.h[i], this.h[s]] = [this.h[s], this.h[i]]; i = s; }
                        else break;
                    }
                }
            }

            self.onmessage = function(e) {
                const { type, data } = e.data;

                if (type === 'BUILD') {
                    graph.clear();
                    let nodeId = 0;
                    const elements = data.elements;
                    
                    elements.forEach(way => {
                        if (way.type === 'way') {
                            const hw = way.tags.highway;
                            let penalty = 1.0;
                            if (hw === 'primary') penalty = 4.0;
                            else if (hw === 'cycleway') penalty = 0.7;
                            else if (hw === 'motorway') return;

                            const pts = way.geometry;
                            for (let i = 0; i < pts.length - 1; i++) {
                                const uStr = pts[i].lon.toFixed(5) + ',' + pts[i].lat.toFixed(5);
                                const vStr = pts[i+1].lon.toFixed(5) + ',' + pts[i+1].lat.toFixed(5);
                                
                                if(!graph.has(uStr)) graph.set(uStr, {id: nodeId++, edges: [], lon: pts[i].lon, lat: pts[i].lat});
                                if(!graph.has(vStr)) graph.set(vStr, {id: nodeId++, edges: [], lon: pts[i+1].lon, lat: pts[i+1].lat});
                                
                                const u = graph.get(uStr);
                                const v = graph.get(vStr);
                                const d = getDist(u.lat, u.lon, v.lat, v.lon);

                                u.edges.push({to: vStr, d: d * penalty, real: d});
                                v.edges.push({to: uStr, d: d * penalty, real: d});
                            }
                        }
                    });
                    self.postMessage({ type: 'READY', nodes: graph.size });
                }

                if (type === 'ROUTE') {
                    const startT = Date.now();
                    const path = solve(data.start, data.end);
                    self.postMessage({ type: 'RESULT', path, time: Date.now() - startT });
                }
            };

            function getDist(la1, lo1, la2, lo2) {
                const dLat = (la2 - la1) * Math.PI / 180;
                const dLon = (lo2 - lo1) * Math.PI / 180;
                const a = Math.sin(dLat/2)**2 + Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLon/2)**2;
                return 12742 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            }

            function findNearest(lon, lat) {
                let min = Infinity, best = null;
                for (const [key, node] of graph) {
                    const d = (node.lon - lon)**2 + (node.lat - lat)**2;
                    if (d < min) { min = d; best = key; }
                }
                return best;
            }

            function solve(sObj, eObj) {
                const start = findNearest(sObj.lng, sObj.lat);
                const end = findNearest(eObj.lng, eObj.lat);
                
                const dists = new Map();
                const prev = new Map();
                const pq = new FastHeap();

                dists.set(start, 0);
                pq.push(start, 0);

                while (pq.h.length > 0) {
                    const {n: curr, p: d} = pq.pop();
                    if (curr === end) break;
                    if (d > (dists.get(curr) || Infinity)) continue;

                    const node = graph.get(curr);
                    for (const edge of node.edges) {
                        const newD = d + edge.d;
                        if (newD < (dists.get(edge.to) || Infinity)) {
                            dists.set(edge.to, newD);
                            prev.set(edge.to, {p: curr, r: edge.real});
                            pq.push(edge.to, newD);
                        }
                    }
                }

                const coords = [];
                let curr = end;
                let totalDist = 0;
                while (curr) {
                    const n = graph.get(curr);
                    coords.push([n.lat, n.lon]);
                    const info = prev.get(curr);
                    if (info) totalDist += info.r;
                    curr = info ? info.p : null;
                }
                return { coords, totalDist };
            }
        `], { type: 'application/javascript' });

                } else if (type === 'RESULT') {

            };
        };

        async function loadData() {
            const code = document.getElementById('deptSelect').value;
            const bounds = {
                "75": [48.81, 2.22, 48.90, 2.47],
                "33": [44.75, -0.75, 45.0, -0.4],
                "69": [45.7, 4.75, 45.85, 4.95],
                "13": [43.2, 5.25, 43.4, 5.5]
            }[code];

            updateStatus('Interrogation Overpass...', true);
            map.fitBounds([[bounds[0], bounds[1]], [bounds[2], bounds[3]]]);

            const query = `[out:json][timeout:60];way["highway"~"primary|secondary|tertiary|residential|cycleway|path|track"](${bounds[0]},${bounds[1]},${bounds[2]},${bounds[3]});out geom;`;
            
            try {
                const res = await fetch('https://overpass-api.de/api/interpreter', {
                    method: 'POST',
                    body: `data=${encodeURIComponent(query)}`
                });
                const data = await res.json();
                updateStatus('Indexation du graphe...', true);
                worker.postMessage({ type: 'BUILD', data });
            } catch (err) {
                alert("Erreur réseau ou zone trop grande.");
                updateStatus('Erreur', false);
            }
        }

        function handleMapClick(e) {
            if (!points.start) {
                points.start = e.latlng;
                startMarker = L.circleMarker(e.latlng, { color: '#10b981', radius: 8, fillOpacity: 1 }).addTo(map);
            } else if (!points.end) {
                points.end = e.latlng;
                endMarker = L.circleMarker(e.latlng, { color: '#ef4444', radius: 8, fillOpacity: 1 }).addTo(map);
                updateStatus('Calcul Dijkstra...', true);
                worker.postMessage({ type: 'ROUTE', data: { start: points.start, end: points.end } });
            } else {
                resetApp();
                handleMapClick(e);
            }
        }

        function showRoute(path, time) {
            if (routeLayer) map.removeLayer(routeLayer);
            updateStatus('Prêt', false);
            
            if (path.coords.length < 2) return alert("Aucun chemin trouvé sur ce réseau.");

            routeLayer = L.polyline(path.coords, { color: '#059669', weight: 6, opacity: 0.8 }).addTo(map);
            document.getElementById('routeInfo').classList.remove('hidden');
            document.getElementById('txtDist').innerText = path.totalDist.toFixed(1);
            document.getElementById('txtNodes').innerText = time;
        }

        function resetApp() {
            points = { start: null, end: null };
            if (startMarker) map.removeLayer(startMarker);
            if (endMarker) map.removeLayer(endMarker);
            if (routeLayer) map.removeLayer(routeLayer);
            document.getElementById('routeInfo').classList.add('hidden');
        }

        function updateStatus(label, loading) {
            document.getElementById('statusBox').classList.remove('hidden');
            document.getElementById('statusLabel').innerText = label;
            document.getElementById('loader').style.display = loading ? 'block' : 'none';
        }
    </script>
